name: Build Yopic APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y openjdk-17-jdk python3-pip unzip libffi-dev libssl-dev
          pip install buildozer cython==0.29.33
      - name: Prepare files
        run: |
          if [ -f Yopic.zip ]; then unzip -o Yopic.zip -d .; fi
          ls -la
      - name: Build
        run: buildozer android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Yopic-APK
          path: bin/*.apk
