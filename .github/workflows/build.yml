name: Build Yopic APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-20.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install Buildozer
        run: |
          sudo apt update
          sudo apt install -y openjdk-17-jdk zip unzip python3-pip
          pip install --upgrade pip
          pip install buildozer cython==0.29.33
      - name: Unzip Yopic
        run: |
          unzip -o Yopic.zip
          # اذا الملفات داخل مجلد Yopic انقلها للخارج
          if [ -d Yopic ]; then mv Yopic/* .; fi
          if [ -d yopic ]; then mv yopic/* .; fi
          ls -la
          ls -la assets || echo "no assets folder"
      - name: Build APK
        run: |
          buildozer android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Yopic-APK
          path: bin/*.apk
